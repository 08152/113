<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine eigene KI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #chat {
            height: 500px;
            overflow-y: auto;
            background: #1c1c1c;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 12px;
            max-width: 80%;
            white-space: pre-wrap;
        }

        .user {
            background: #333;
            margin-left: auto;
        }

        .ai {
            background: #222;
            border: 1px solid #444;
            margin-right: auto;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input,
        textarea,
        select,
        button {
            font-family: inherit;
            font-size: 16px;
        }

        #messageInput {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            outline: none;
        }

        button {
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: black;
            font-weight: bold;
        }

        .training {
            margin-top: 20px;
            padding: 15px;
            background: #1c1c1c;
            border-radius: 15px;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            resize: vertical;
            margin-top: 8px;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }

        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
        }

        #status {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🤖 Meine eigene KI</h1>

    <div id="chat">
        <div class="message ai">
            Hallo! Ich bin deine eigene kleine KI. Schreib mir etwas.
        </div>
    </div>

    <div class="input-row">
        <input
            id="messageInput"
            type="text"
            placeholder="Schreibe etwas..."
            autocomplete="off"
        >
        <button id="sendButton">Senden</button>
    </div>

    <div class="training">

        <h2>KI trainieren</h2>

        <label>Neue Frage:</label>

        <textarea
            id="trainQuestion"
            placeholder="z. B. Wie heißt du?"
        ></textarea>

        <label>Antwort:</label>

        <textarea
            id="trainAnswer"
            placeholder="z. B. Ich bin deine eigene KI."
        ></textarea>

        <button id="trainButton">
            KI trainieren
        </button>

        <button id="resetButton">
            Training zurücksetzen
        </button>

        <div id="status">
            KI wird geladen...
        </div>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
