<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meine KI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid #333;
            font-size: 20px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .user {
            align-self: flex-end;
            background: #333;
        }

        .ai {
            align-self: flex-start;
            background: #222;
        }

        #inputArea {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #333;
        }

        #input {
            flex: 1;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #1b1b1b;
            color: white;
            outline: none;
            font-size: 16px;
        }

        #send {
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        #send:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <header>
        Meine KI
    </header>

    <main id="chat">
        <div class="message ai">
            Hallo! Ich bin deine eigene KI.
        </div>
    </main>

    <div id="inputArea">
        <input
            id="input"
            type="text"
            placeholder="Schreibe eine Nachricht..."
            autocomplete="off"
        >

        <button id="send">
            Senden
        </button>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
